
name: Publish Release

# release ブランチへのプッシュ (リリースコミット) or v* タグのプッシュ or 手動実行
on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

# ジョブの定義
jobs:

  # インストーラーのビルド
  ## タグプッシュ・手動実行・リリースコミットの場合のみ実行する
  build_installer:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Release:')
    uses: ./.github/workflows/build_installer.yaml

  # インストーラーのビルドが終わったら、タグ付けしてリリースを公開
  ## サードパーティーライブラリは本家 KonomiTV のリリースから取得するため、ここではビルドしない
  publish_release:
    runs-on: ubuntu-22.04
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Release:')
    needs:
      - build_installer
    steps:

      # ビルド済みのインストーラーをダウンロード
      - name: Download Installer (for Windows)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.exe
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.elf
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux ARM)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer-ARM.elf
          path: ${{ github.workspace }}/

      # KonomiTV のソースコードをチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: KonomiTV
          token: ${{ secrets.GIT_PUSH_TOKEN }}

      # バージョン番号を取得する
      ## タグプッシュの場合はタグ名から、それ以外はリリースコミットのメッセージから取得する
      - name: Get Version
        id: get_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # タグ名の先頭の "v" を除去してバージョン番号を取得
            echo version=$(echo "${{ github.ref_name }}" | sed 's/^v//') >> $GITHUB_OUTPUT
          else
            echo version=$(echo "$COMMIT_MESSAGE" | sed -e 's/Release: version //') >> $GITHUB_OUTPUT
          fi

      # 直前のタグからの変更履歴を生成する
      ## マージコミットを除いた全コミットを "- <件名> (<ハッシュ>)" 形式で列挙する
      - name: Generate Changelog
        id: changelog
        working-directory: KonomiTV
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # release ブランチプッシュの場合のみ新バージョンのタグを作成する
      ## タグプッシュの場合はすでにタグが存在するためスキップする
      - name: Create New Version Tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: KonomiTV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch release
          git tag v${{ steps.get_version.outputs.version }} release
          git push origin --tags

      # リリースを作成
      ## body に変更履歴を含める (generateReleaseNotes も併用して PR ベースのノートも付与する)
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'KonomiTV-Installer.exe,KonomiTV-Installer.elf,KonomiTV-Installer-ARM.elf'
          generateReleaseNotes: true
          name: KonomiTV (Custom Fork) ${{ steps.get_version.outputs.version }}
          tag: v${{ steps.get_version.outputs.version }}
          body: |
            ## 変更履歴 / Changelog

            ${{ steps.changelog.outputs.changelog }}
