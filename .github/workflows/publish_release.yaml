
name: Publish Release

# release ブランチに変更があったとき or 手動実行
on:
  push:
    branches:
      - release
  workflow_dispatch:

# ジョブの定義
jobs:

  # インストーラーのビルド
  ## リリースコミットでのみ実行する (lint → build の順で実行される)
  build_installer:
    if: contains(github.event.head_commit.message, 'Release:')
    uses: ./.github/workflows/build_installer.yaml

  # インストーラーのビルドが終わったら、タグ付けしてリリースを公開
  ## サードパーティーライブラリは本家 KonomiTV のリリースから取得するため、ここではビルドしない
  ## リリースコミットでのみ実行する
  publish_release:
    runs-on: ubuntu-22.04
    if: contains(github.event.head_commit.message, 'Release:')
    needs:
      - build_installer
    steps:

      # ビルド済みのインストーラーをダウンロード
      - name: Download Installer (for Windows)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.exe
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer.elf
          path: ${{ github.workspace }}/
      - name: Download Installer (for Linux ARM)
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Installer-ARM.elf
          path: ${{ github.workspace }}/

      # KonomiTV のソースコードをチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: KonomiTV
          token: ${{ secrets.GIT_PUSH_TOKEN }}

      # KonomiTV のバージョン番号をリリースコミットのコミットメッセージから取得
      - name: Get Version
        id: get_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo version=$(echo "$COMMIT_MESSAGE" | sed -e 's/Release: version //') >> $GITHUB_OUTPUT

      # 直前のタグからの変更履歴を生成する
      ## マージコミットを除いた全コミットを "- <件名> (<ハッシュ>" 形式で列挙する
      - name: Generate Changelog
        id: changelog
        working-directory: KonomiTV
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          # GitHub Actions の multiline output として出力する
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # リリースコミットに対応する新バージョンのタグを release ブランチで作成
      - name: Create New Version Tag
        working-directory: KonomiTV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch release
          git tag v${{ steps.get_version.outputs.version }} release
          git push origin --tags

      # リリースを作成
      ## body に変更履歴を含める (generateReleaseNotes も併用して PR ベースのノートも付与する)
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'KonomiTV-Installer.exe,KonomiTV-Installer.elf,KonomiTV-Installer-ARM.elf'
          generateReleaseNotes: true
          name: KonomiTV (Custom Fork) ${{ steps.get_version.outputs.version }}
          tag: v${{ steps.get_version.outputs.version }}
          body: |
            ## 変更履歴 / Changelog

            ${{ steps.changelog.outputs.changelog }}
